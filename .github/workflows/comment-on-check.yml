name: Comment on translation check

# Runs after "Check translations" finishes on a pull request and leaves
# (or updates) one comment explaining why the check failed. It lives in
# a separate workflow so it can comment on pull requests from forks.
#
# SECURITY: the artifact this job downloads is produced by a workflow that
# ran on the pull request's own head. For the `pull_request` event GitHub
# takes the workflow definition from that head, so a pull request from a
# fork controls every byte of the artifact. Nothing read from it may decide
# WHICH pull request is commented on, and its text is never trusted markup.

on:
  workflow_run:
    workflows: ["Check translations"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: check-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Resolve the pull request from the head SHA carried by the
            // workflow_run event, which only GitHub sets. Reading a number out
            // of the artifact would let a fork aim this comment at any pull
            // request in the repository: this job holds `pull-requests: write`
            // and no `issues: write`, so plain issues are out of reach, but
            // every pull request is not.
            // workflow_run.pull_requests is empty for forks, so it cannot
            // stand in for this lookup.
            // sort/direction are explicit so the pick below does not depend on
            // the API's default ordering.
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open',
              sort: 'created', direction: 'asc', per_page: 100,
            });
            const matches = open.filter(p => p.head.sha === run.head_sha);
            if (matches.length === 0) {
              core.info(`No open pull request has head ${run.head_sha}; nothing to comment on.`);
              return;
            }
            if (matches.length > 1) {
              core.info(`Several open pull requests share head ${run.head_sha} (${matches.map(p => p.number).join(', ')}); commenting on the oldest.`);
            }
            const pr = matches[0].number;

            // Also fork-controlled: the check could have been patched to write
            // a zero here. Never call this a pass unless the run that produced
            // the artifact actually succeeded, so the comment can never
            // contradict the check status shown on the pull request.
            const status = fs.readFileSync('status.txt', 'utf8').trim();
            const passed = status === '0' && run.conclusion === 'success';

            // Attacker-controlled text. Neutralise backticks so it cannot
            // escape the fenced block below, and cap the length. Cutting on a
            // UTF-16 boundary can split a surrogate pair and leave a lone
            // surrogate, which the comment API rejects, so step back one unit
            // when the cut lands between the halves of a pair.
            const LIMIT = 20000;
            let report = fs.readFileSync('report.txt', 'utf8').trim().replace(/`/g, '‵');
            if (report.length > LIMIT) {
              const last = report.charCodeAt(LIMIT - 1);
              const end = (last >= 0xd800 && last <= 0xdbff) ? LIMIT - 1 : LIMIT;
              report = report.slice(0, end);
            }
            const marker = '<!-- translation-check -->';

            const hints = [];
            const add = (re, text) => { if (re.test(report)) hints.push(text); };
            add(/header is/, '**The file still has its working-copy header.** Published files must be `key,section,node,order,speaker,translation`. Run `tools/hash-strings.ps1` (or use *Hash for commit* in the in-game F1 menu) and commit the result.');
            add(/is not 16 lowercase hex digits/, '**Some keys are plain text instead of hashes.** The repository never carries the game\'s English script, so each line is identified by a 16-character hash of the source text, or by a line ID such as `line:6046bedf` for a per-line translation. `tools/hash-strings.ps1` converts a working copy into that form.');
            add(/must not be committed/, '**A working copy was committed.** Files under `Translations/_discovered/` contain the English source and must stay local. Please remove them from the pull request.');
            add(/duplicate key/, '**Duplicate keys.** The same line appears more than once; keep one translation per key.');
            add(/empty translation/, '**Empty translations.** Leave a line out rather than committing it blank; the game then falls back to English for it.');
            add(/expected \d+ fields/, '**Malformed rows.** Some rows have the wrong number of columns, usually an unquoted comma or line break inside the translation. Wrap such values in double quotes.');
            add(/does not look like an identifier/, '**Unexpected text in `section` or `node`.** These columns hold game identifiers such as `L01 Ryan` or `Ryan_1_intro`. Keep them exactly as exported and edit only the `translation` column.');
            add(/no strings\.csv/, '**A language folder has no `strings.csv`.** Every folder under `Translations/` needs one; add the file or remove the empty folder.');
            add(/empty file/, '**An empty `strings.csv`.** The file needs at least the header line `key,section,node,order,speaker,translation`.');
            if (hints.length === 0) hints.push('The full report below lists each problem with its file and line number.');

            let body;
            if (passed) {
              body = `${marker}\nThe translation check passed. Thank you for the contribution!`;
            } else if (status === '0') {
              body = [
                marker,
                'The translation check itself reported no problems, but the **Check translations** workflow did not succeed.',
                '',
                `See [the workflow run](${run.html_url}) for the step that failed.`,
              ].join('\n');
            } else {
              body = [
                marker,
                'Thanks for the pull request! Unfortunately the automatic translation check could not accept it yet, for the following reason(s):',
                '',
                ...hints.map(h => `- ${h}`),
                '',
                '<details><summary>Full report</summary>',
                '',
                '```',
                report,
                '```',
                '</details>',
                '',
                'See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the workflow. Push a fix to this branch and the check will run again.',
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            // Only ever edit a comment this workflow wrote. Without the author
            // check, a human comment starting with the marker is overwritten.
            const mine = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else if (status !== '0') {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
