name: CI image

# The image the checks and the hashing step run in, on this repository's
# machines and on yours:
# docker/Dockerfile, pushed to ghcr.io/<owner>/dragnwash-localization-ci.
#
# It is built when anything under docker/ changes, and by hand. The checks
# themselves (check-translations.yml, commit-checker.yml) pull :latest, so a
# change here reaches them on their next run. Nothing else depends on it: a fork with no
# package permissions simply does not run this job, and its checks keep
# working because they fall back to installing the tools step by step.
#
# See docs/DOCKER.md.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'TomXV/dragnwash-localization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's own driver is plain docker, which cannot export a build
      # cache ("Cache export is not supported for the docker driver"); buildx
      # sets up the BuildKit builder that can.
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower case: a registry path may not carry capitals, and the owner has
      # them. The tags are :latest for the workflows and :<sha> so a run can be
      # traced back to the Dockerfile it used.
      - name: The image's name
        id: name
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/dragnwash-localization-ci" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
