name: CodeQL

# Code scanning: GitHub reads the plugin's C# and reports what looks like a
# security problem on the Security tab, and as a comment on the line in a pull
# request that introduces one. SECURITY.md says what to do with a real
# finding; this is the machine's first pass, not a substitute for it.
#
# build-mode: none on purpose. The plugin compiles against the game's own
# assemblies, which this public repository must never contain (the build
# fetches them from a private repository with a secret a fork cannot reach),
# so nothing here can be built on a runner for a pull request. CodeQL's C#
# analysis reads the source without building it, which works without the
# game — it simply knows less about the types that come from the missing
# assemblies, so a finding that depends on one of them may be missed.
#
# Neither the translations nor tools/ are scanned: the first is data, the
# second is maintainer tooling that runs on the repository itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, so a new query added to CodeQL finds old code too.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      # Writing the results to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
